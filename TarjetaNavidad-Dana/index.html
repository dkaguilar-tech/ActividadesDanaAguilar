<!-- Este desarrollo vamos a diseñar una tarjeta interactiva de Navidad -->
<!-- Nombre: Dana Aguilar -->
<!-- Actividad 1 -->

<!DOCTYPE html> <!--Esta etiqueta declara el tipo de documento-->
<html lang="es">
<head> 
    <!El titulo de la pagina no es visible en el desarrollo pero es lo que finciona para el SEO-->

<tittle> Tarjeta de navidad Personalizados </tittle>
<!--En la etiqueta head va todo lo que no es visible en la pagina web pero la hace funcionar-->
<!Acontinuacion los metadatos para que la pagina reconozca, caracteres especiales y se adapte a diferentes dispositivos-->
<meta charset="UTF-8"> <!Este metadato es para los caracteres especiales-->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tarjeta de Navidad interactiva con diseño personalizado">
  <meta name="author" content="Dana Aguilar">
 
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>

<link rel="stylesheet" href="styles.css">
</head> <!--HASTA AQUI VA EL HEAD-->

<!--AQUI INICIA EL BODY-->
<body> 
<div class="main-container">
   <!-- Cover -->
   <div class="page active" id="page-0">
    <div class="float-container">
     <img src="Navidad.avif" alt="Arbol de Navidad" class="cover-img">
    </div>
    <h1 class="cover-title">Feliz Navidad 2026 ❤️</h1>
    <p class="cover-subtitle">Con todo mi cariño</p>
    <button id="btn-enter" class="btn-primary">
      <span class="btn-text">Click </span>
    </button>
   </div>

<!--Mensaje pagina 1-->
<div class="page" id="pagina1">
    <div class="photo-circle">
      <img class="photo-img" loading="lazy" src="PerroNavidad.avif" alt="imagen de perro">
    </div>
    <p class="msg-text">Felices Guauchristmas 🐾</p>
    <button id="btn-next-1" class="btn-secondary">
      <span class="btn-text">Siguiente</span>
    </button>
   </div>

<!--Mensaje pagina 2-->
<div class="page" id="pagina2">
    <h2 class="gallery-title">Con mucho cariño ✨</h2>
    <div class="gallery-grid">
     <div class="gallery-item gold-border">
      <img class="gallery-img" loading="lazy" src="Christmas.avif" alt="Imagen de Navidad">
     </div>
     <div class="gallery-item gold-border">
      <img class="gallery-img" loading="lazy" src="Jengibre.avif" alt="Imagen de Jengibre">
     </div>
     <div class="gallery-item gold-border">
      <img class="gallery-img" loading="lazy" src="RolesNavidad.avif" alt="Imagen de Roles de Navidad">
     </div>
    </div>
  
    <p class="gallery-caption">Los mejores deseos para esta Navidad </p>
   </div>

<script src="script.js"></script>
</body>
   </html>
